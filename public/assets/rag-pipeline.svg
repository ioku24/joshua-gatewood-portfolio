<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F4EF"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ECFDF5"/>
      <stop offset="1" stop-color="#D1FAE5"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1080" height="640" fill="#FAFAF8"/>

  <!-- Title -->
  <text x="48" y="56" font-family="'Cabinet Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="33" fill="#0F172A">Hybrid RAG over my Obsidian wiki-link graph</text>
  <text x="48" y="88" font-size="16" fill="#64748B">Keyword + vector retrieval that follows my note links, and stays silent when nothing fits.</text>

  <!-- Connectors -->
  <g stroke="#CBD5E1" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M220,320 C250,320 240,202 262,202" marker-end="url(#arrow)"/>
    <path d="M220,350 C250,350 240,468 262,468" marker-end="url(#arrow)"/>
    <path d="M490,202 C512,202 505,320 522,326" marker-end="url(#arrow)"/>
    <path d="M490,468 C512,468 505,350 522,344" marker-end="url(#arrow)"/>
    <path d="M672,335 L697,335" marker-end="url(#arrow)"/>
    <path d="M880,320 C896,320 890,242 903,240" marker-end="url(#arrow)"/>
    <path d="M988,292 L988,387" marker-end="url(#arrow)"/>
  </g>

  <!-- Prompt -->
  <g filter="url(#shadow)"><rect x="48" y="282" width="172" height="106" rx="16" fill="url(#card)" stroke="#E2E8F0"/></g>
  <circle cx="134" cy="312" r="18" fill="#F1F5F9"/>
  <g transform="translate(123,301)" stroke="#475569" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M2 4 h18 a2 2 0 0 1 2 2 v7 a2 2 0 0 1 -2 2 h-8 l-4 4 v-4 h-6 a2 2 0 0 1 -2 -2 v-7 a2 2 0 0 1 2 -2 z"/>
  </g>
  <text x="134" y="356" text-anchor="middle" font-size="17" font-weight="600" fill="#0F172A">Prompt</text>
  <text x="134" y="377" text-anchor="middle" font-size="12.5" fill="#64748B">any agent turn</text>

  <!-- Keyword floor -->
  <g filter="url(#shadow)"><rect x="262" y="150" width="228" height="104" rx="16" fill="url(#card)" stroke="#E2E8F0"/></g>
  <circle cx="376" cy="180" r="18" fill="#F1F5F9"/>
  <g transform="translate(365,169)" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="9" cy="9" r="6"/>
    <line x1="13.5" y1="13.5" x2="19" y2="19"/>
  </g>
  <text x="376" y="224" text-anchor="middle" font-size="17" font-weight="600" fill="#0F172A">Keyword floor</text>
  <text x="376" y="245" text-anchor="middle" font-size="12.5" fill="#64748B">local · always runs</text>

  <!-- Semantic search -->
  <g filter="url(#shadow)"><rect x="262" y="416" width="228" height="104" rx="16" fill="url(#card)" stroke="#E2E8F0"/></g>
  <circle cx="376" cy="446" r="18" fill="#EEF2FF"/>
  <g transform="translate(366,436)">
    <line x1="5" y1="7" x2="15" y2="5" stroke="#4F46E5" stroke-width="1.5"/>
    <line x1="15" y1="5" x2="10" y2="16" stroke="#4F46E5" stroke-width="1.5"/>
    <line x1="5" y1="7" x2="10" y2="16" stroke="#4F46E5" stroke-width="1.5"/>
    <circle cx="5" cy="7" r="2.3" fill="#4F46E5"/><circle cx="15" cy="5" r="2.3" fill="#4F46E5"/><circle cx="10" cy="16" r="2.3" fill="#4F46E5"/>
  </g>
  <text x="376" y="490" text-anchor="middle" font-size="17" font-weight="600" fill="#0F172A">Semantic search</text>
  <text x="376" y="511" text-anchor="middle" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="11.5" fill="#4F46E5">Pinecone · multilingual-e5</text>

  <!-- Merge -->
  <g filter="url(#shadow)"><rect x="522" y="283" width="150" height="104" rx="16" fill="url(#card)" stroke="#E2E8F0"/></g>
  <circle cx="597" cy="313" r="18" fill="#F1F5F9"/>
  <g transform="translate(586,302)" stroke="#475569" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M3 4 h16 l-6 7 v6 l-4 -2 v-4 z"/>
  </g>
  <text x="597" y="357" text-anchor="middle" font-size="17" font-weight="600" fill="#0F172A">Merge</text>
  <text x="597" y="378" text-anchor="middle" font-size="12.5" fill="#64748B">dedupe · top-4</text>

  <!-- Wiki-link expand -->
  <g filter="url(#shadow)"><rect x="697" y="283" width="184" height="104" rx="16" fill="url(#card)" stroke="#E2E8F0"/></g>
  <circle cx="789" cy="313" r="18" fill="#FEF3C7"/>
  <g transform="translate(778,302)">
    <line x1="6" y1="6" x2="16" y2="9" stroke="#B45309" stroke-width="1.6"/>
    <line x1="16" y1="9" x2="8" y2="17" stroke="#B45309" stroke-width="1.6"/>
    <circle cx="6" cy="6" r="2.4" fill="#B45309"/><circle cx="16" cy="9" r="2.4" fill="#B45309"/><circle cx="8" cy="17" r="2.4" fill="#B45309"/>
  </g>
  <text x="789" y="357" text-anchor="middle" font-size="17" font-weight="600" fill="#0F172A">Wiki-link expand</text>
  <text x="789" y="378" text-anchor="middle" font-size="12.5" fill="#B45309">pulls 1-hop linked notes</text>

  <!-- Abstain gate -->
  <g filter="url(#shadow)"><rect x="903" y="188" width="170" height="104" rx="16" fill="url(#emerald)" stroke="#A7F3D0"/></g>
  <circle cx="988" cy="216" r="18" fill="#FFFFFF"/>
  <g transform="translate(977,205)" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M11 2 l7 2.6 v5.4 c0 4.5 -3.6 7.2 -7 9 c-3.4 -1.8 -7 -4.5 -7 -9 v-5.4 z"/>
    <path d="M7.6 11 l2.2 2.2 l4 -4.4"/>
  </g>
  <text x="988" y="256" text-anchor="middle" font-size="17" font-weight="600" fill="#065F46">Abstain gate</text>
  <text x="988" y="277" text-anchor="middle" font-size="12.5" fill="#047857">inject only if sure</text>

  <!-- Output -->
  <g filter="url(#shadow)"><rect x="903" y="388" width="170" height="104" rx="16" fill="url(#dark)" stroke="#0F172A"/></g>
  <circle cx="988" cy="416" r="18" fill="#FFFFFF" fill-opacity="0.12"/>
  <g transform="translate(977,405)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <rect x="4" y="6" width="14" height="11" rx="3"/>
    <line x1="11" y1="6" x2="11" y2="3"/>
    <circle cx="11" cy="2.2" r="1.3" fill="#FFFFFF"/>
    <circle cx="8.5" cy="11.5" r="1.1" fill="#FFFFFF" stroke="none"/>
    <circle cx="13.5" cy="11.5" r="1.1" fill="#FFFFFF" stroke="none"/>
  </g>
  <text x="988" y="456" text-anchor="middle" font-size="17" font-weight="600" fill="#FFFFFF">Injected context</text>
  <text x="988" y="477" text-anchor="middle" font-size="12.5" fill="#CBD5E1">into the live agent</text>

  <!-- Metrics strip -->
  <g filter="url(#shadow)"><rect x="48" y="566" width="632" height="46" rx="14" fill="url(#card)" stroke="#E2E8F0"/></g>
  <text x="70" y="595" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="14.5" fill="#475569">golden-set eval&#160;&#160;·&#160;&#160;Recall@4 <tspan fill="#0F172A" font-weight="600">0.91</tspan>&#160;&#160;·&#160;&#160;MRR <tspan fill="#0F172A" font-weight="600">0.80</tspan>&#160;&#160;·&#160;&#160;<tspan fill="#059669" font-weight="600">100%</tspan> correct abstention</text>
</svg>
