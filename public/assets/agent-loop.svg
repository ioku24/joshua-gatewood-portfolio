<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F4EF"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ECFDF5"/>
      <stop offset="1" stop-color="#D1FAE5"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1080" height="640" fill="#FAFAF8"/>

  <!-- Title -->
  <text x="48" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#0F172A">Autonomous agent, human-in-the-loop</text>
  <text x="48" y="90" font-size="17" fill="#64748B">A deterministic pipeline, not a swarm. Every output is reviewed before it ships.</text>

  <!-- Connectors -->
  <g stroke="#CBD5E1" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M320,312 L413,312" marker-end="url(#arrow)"/>
    <path d="M665,312 L758,312" marker-end="url(#arrow)"/>
    <path d="M885,374 C885,412 720,432 682,432" marker-end="url(#arrow)"/>
    <path d="M470,489 L392,489" marker-end="url(#arrow)"/>
  </g>
  <!-- loop back (dashed) -->
  <g stroke="#94A3B8" stroke-width="2" fill="none" stroke-dasharray="6 6" stroke-linecap="round">
    <path d="M180,430 C160,392 168,360 195,340" marker-end="url(#arrow)"/>
  </g>
  <text x="120" y="392" font-size="12.5" fill="#94A3B8" font-style="italic">daily</text>

  <!-- Signal sources -->
  <g filter="url(#shadow)"><rect x="70" y="250" width="250" height="124" rx="18" fill="url(#card)" stroke="#E2E8F0"/></g>
  <circle cx="195" cy="280" r="20" fill="#F1F5F9"/>
  <g transform="translate(183,268)" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="6" cy="18" r="1.6" fill="#475569" stroke="none"/>
    <path d="M5 12 a7 7 0 0 1 7 7"/>
    <path d="M5 6 a13 13 0 0 1 13 13"/>
  </g>
  <text x="195" y="328" text-anchor="middle" font-size="19" font-weight="600" fill="#0F172A">Signal sources</text>
  <text x="195" y="350" text-anchor="middle" font-size="13.5" fill="#64748B">X · Reddit · collected on a schedule</text>

  <!-- Agent -->
  <g filter="url(#shadow)"><rect x="415" y="250" width="250" height="124" rx="18" fill="url(#card)" stroke="#E2E8F0"/></g>
  <circle cx="540" cy="280" r="20" fill="#EEF2FF"/>
  <g transform="translate(528,268)" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <rect x="5" y="7" width="14" height="12" rx="3"/>
    <line x1="12" y1="7" x2="12" y2="3.5"/>
    <circle cx="12" cy="2.4" r="1.4" fill="#4F46E5"/>
    <circle cx="9.5" cy="13" r="1.2" fill="#4F46E5" stroke="none"/>
    <circle cx="14.5" cy="13" r="1.2" fill="#4F46E5" stroke="none"/>
  </g>
  <text x="540" y="328" text-anchor="middle" font-size="19" font-weight="600" fill="#0F172A">Agent</text>
  <text x="540" y="350" text-anchor="middle" font-size="13.5" fill="#64748B">rank · reason · draft in a tuned voice</text>

  <!-- Fact-check -->
  <g filter="url(#shadow)"><rect x="760" y="250" width="250" height="124" rx="18" fill="url(#card)" stroke="#E2E8F0"/></g>
  <circle cx="885" cy="280" r="20" fill="#F1F5F9"/>
  <g transform="translate(873,268)" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <rect x="5" y="4" width="14" height="17" rx="2"/>
    <path d="M9 4 h6 v3 h-6 z"/>
    <path d="M8.5 13 l2 2 l4.5 -4.5"/>
  </g>
  <text x="885" y="328" text-anchor="middle" font-size="19" font-weight="600" fill="#0F172A">Fact-check</text>
  <text x="885" y="350" text-anchor="middle" font-size="13.5" fill="#64748B">verify claims · dedupe vs history</text>

  <!-- Human approval gate (emerald) -->
  <g filter="url(#shadow)"><rect x="470" y="430" width="300" height="118" rx="18" fill="url(#emerald)" stroke="#A7F3D0"/></g>
  <circle cx="580" cy="460" r="20" fill="#FFFFFF"/>
  <g transform="translate(568,448)" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="12" cy="8" r="3.6"/>
    <path d="M5 20 a7 7 0 0 1 14 0"/>
  </g>
  <text x="620" y="482" text-anchor="middle" font-size="19" font-weight="600" fill="#065F46">Human approval gate</text>
  <text x="620" y="504" text-anchor="middle" font-size="13.5" fill="#047857">approve · edit · reject (Telegram)</text>

  <!-- Publish (dark anchor) -->
  <g filter="url(#shadow)"><rect x="110" y="430" width="282" height="118" rx="18" fill="url(#dark)" stroke="#0F172A"/></g>
  <circle cx="220" cy="460" r="20" fill="#FFFFFF" fill-opacity="0.12"/>
  <g transform="translate(208,448)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M22 3 L3 10.5 l7.5 2.6 l2.6 7.5 z"/>
    <path d="M22 3 L10.5 13.1"/>
  </g>
  <text x="255" y="482" text-anchor="middle" font-size="19" font-weight="600" fill="#FFFFFF">Publish / act</text>
  <text x="255" y="504" text-anchor="middle" font-size="13.5" fill="#CBD5E1">only what a human OK'd</text>

  <!-- footnote -->
  <text x="540" y="600" text-anchor="middle" font-size="13.5" fill="#94A3B8" font-style="italic">the same runtime also runs an AI-frontier research agent that briefs me daily</text>
</svg>
